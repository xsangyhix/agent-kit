[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-kit"
version = "0.1.0"
description = "Install and update a project-agnostic agent setup."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
agent-kit = "agent_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_kit = ["payload/**/*"]
